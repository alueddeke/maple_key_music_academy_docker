# Docker Compose for Maple Key Music Academy - Development

services:
  # PostgreSQL Database
  db:
    image: postgres:14
    container_name: maple_key_db
    env_file:
      - ./.envs/env.dev
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"  # Exposed for development tools
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U maple_key_user -d maple_key_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Nginx Reverse Proxy
  nginx:
    build:
      context: nginx
      dockerfile: Dockerfile.dev
    restart: always
    container_name: maple_key_nginx
    ports:
      - "8000:80"
    depends_on:
      - api
      - frontend

  # Django Backend API
  api:
    build:
      context: ../maple_key_music_academy_backend
      dockerfile: Dockerfile
    container_name: maple_key_api
    env_file:
      - ./.envs/env.dev
    volumes:
      - ../maple_key_music_academy_backend:/app
    depends_on:
      db:
        condition: service_healthy
    entrypoint: |
      bash -c "
      python3 manage.py migrate --no-input &&
      python3 manage.py collectstatic --noinput &&
      python3 manage.py runserver 0.0.0.0:8000"

  # Send-run worker (batch-queue wave): drains InvoiceSendRuns off the
  # request workers. Same image as api; no migrate on boot (api owns that).
  # SIGTERM -> finishes the current invoice, then exits; the grace period
  # covers one send incl. retries.
  worker:
    build:
      context: ../maple_key_music_academy_backend
      dockerfile: Dockerfile
    container_name: maple_key_worker
    env_file:
      - ./.envs/env.dev
    volumes:
      - ../maple_key_music_academy_backend:/app
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_started  # api applies migrations first
    stop_grace_period: 60s
    entrypoint: ["python3", "manage.py", "process_invoice_send_runs"]

  # React/Vite Frontend
  frontend:
    build:
      context: ../maple-key-music-academy-frontend
      dockerfile: Dockerfile.dev
    container_name: maple_key_frontend
    environment:
      - NODE_ENV=development
      - VITE_API_URL=http://localhost:8000
      - VITE_GOOGLE_CLIENT_ID=578681672265-r7jpu2dumv6129pkapljb7j8ftk29it5.apps.googleusercontent.com
      - WATCHPACK_POLLING=true
      - FAST_REFRESH=true
      - CHOKIDAR_USEPOLLING=true
      - VITE_POLLING=true
      - VITE_HMR_PORT=5173
    ports:
      - "5173:5173"
    volumes:
      # Only mount source files for hot reloading
      - ../maple-key-music-academy-frontend/src:/app/src
      - ../maple-key-music-academy-frontend/public:/app/public
      - ../maple-key-music-academy-frontend/index.html:/app/index.html
      - ../maple-key-music-academy-frontend/vite.config.ts:/app/vite.config.ts
      # Let Docker handle dependencies automatically
      - vite_cache:/app/.vite/cache

  # API Testing Service
  api-tests:
    build:
      context: ../maple_key_music_academy_backend
      dockerfile: Dockerfile
    container_name: maple_key_api_tests
    env_file:
      - ./.envs/env.dev
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ../maple_key_music_academy_backend:/app
      - test_reports:/app/test_reports/
    command: |
      bash -c "
      python3 manage.py migrate --no-input &&
      python3 manage.py collectstatic --noinput &&
      pytest --cov=. --cov-report=html --cov-report=term --junitxml=test_reports/junit.xml --html=test_reports/report.html --self-contained-html
      "
    profiles:
      - testing

  # ---------------------------------------------------------------------------
  # Monitoring — start with: make monitor  (or docker compose --profile monitoring up)
  # Grafana UI: http://localhost:3000  (admin / $GF_SECURITY_ADMIN_PASSWORD, default admin)
  # Prometheus: http://localhost:9090
  # ---------------------------------------------------------------------------
  prometheus:
    # Pinned (STANDARDS.md: no unpinned images in the deploy path)
    image: prom/prometheus:v3.5.0
    container_name: maple_key_prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=14d'
    ports:
      - "127.0.0.1:9090:9090"
    profiles:
      - monitoring

  loki:
    image: grafana/loki:3.1.0
    container_name: maple_key_loki
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - ./monitoring/loki-config.yaml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    profiles:
      - monitoring

  promtail:
    image: grafana/promtail:3.1.0
    container_name: maple_key_promtail
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - ./monitoring/promtail-config.yaml:/etc/promtail/config.yml:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    profiles:
      - monitoring

  node-exporter:
    image: prom/node-exporter:v1.9.1
    container_name: maple_key_node_exporter
    command:
      - '--path.rootfs=/host'
    volumes:
      # rslave propagation is Linux-only; plain ro keeps local (macOS) dev working
      - /:/host:ro
    ports:
      - "127.0.0.1:9100:9100"
    profiles:
      - monitoring

  grafana:
    image: grafana/grafana:11.1.0
    container_name: maple_key_grafana
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/alerting:/etc/grafana/provisioning/alerting:ro
    # No env_file here on purpose: env.dev holds DB/OAuth secrets that must not
    # leak into the Grafana container. Pass only what Grafana needs.
    environment:
      # Fail fast: no silent admin/admin default (Nick: no fallbacks on the server)
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD:?set GF_SECURITY_ADMIN_PASSWORD in the environment}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_ANALYTICS_REPORTING_ENABLED=false
    depends_on:
      - prometheus
      - loki
    profiles:
      - monitoring

volumes:
  postgres_data:
  vite_cache:
  test_reports:
  prometheus_data:
  loki_data:
  grafana_data:
