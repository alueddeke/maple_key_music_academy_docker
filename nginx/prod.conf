upstream api {
    server api:8000;
}

upstream grafana {
    server grafana:3000;
}

# Redirect all HTTP to HTTPS
server {
    listen 80;
    server_name maplekeymusic.com www.maplekeymusic.com grafana.maplekeymusic.com;
    return 301 https://$host$request_uri;
}

# Main app — maplekeymusic.com
server {
    listen 443 ssl;
    server_name maplekeymusic.com www.maplekeymusic.com;

    ssl_certificate /etc/letsencrypt/live/maplekeymusic.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/maplekeymusic.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location ~ ^/(api|admin|static|media|accounts|health|metrics) {
        proxy_pass http://api;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_connect_timeout 600s;
        proxy_send_timeout 600s;
    }

    location / {
        proxy_pass http://api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Grafana — grafana.maplekeymusic.com
server {
    listen 443 ssl;
    server_name grafana.maplekeymusic.com;

    ssl_certificate /etc/letsencrypt/live/grafana.maplekeymusic.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/grafana.maplekeymusic.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://grafana;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
