name: CI

on:
  pull_request:
    branches: [develop, production]

jobs:
  gitleaks:
    name: gitleaks (secrets scan, full history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan git history for secrets
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1 \
            git /repo --no-banner --redact=90 --exit-code 1 \
            --baseline-path /repo/.gitleaks-baseline.json
