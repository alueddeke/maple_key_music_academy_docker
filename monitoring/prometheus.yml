global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'maple-key-backend'
    static_configs:
      - targets: ['api:8000']
    metrics_path: '/metrics'

  # Host disk / RAM / CPU — feeds the disk>80% and memory-pressure alerts
  - job_name: 'node'
    static_configs:
      - targets: ['node-exporter:9100']

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
